services:
  - type: web
    name: sakina-tranquility
    runtime: python
    buildCommand: "npm ci && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn FrontendAPI:app --host 0.0.0.0 --port "
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
