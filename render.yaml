services:
  - type: web
    name: sakina-tranquility
    runtime: python
    buildCommand: "npm ci && npm run build && pip install -r requirements.txt"
    startCommand: "python run_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_AUXILIARY_MODEL
        value: gemini-3.5-flash-lite
      - key: GOOGLE_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SAKINA_SESSION_SECRET
        sync: false
      - key: SAKINA_ENCRYPTION_KEY
        sync: false
      - key: FEEDBACK_IP_SALT
        sync: false
      - key: SAKINA_ADMIN_KEY
        sync: false

  - type: web
    name: sakina-landing
    runtime: static
    buildCommand: ""
    publishDir: ./landing
