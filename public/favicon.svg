<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="sakinaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D19E"/>
      <stop offset="50%" stop-color="#E8B97A"/>
      <stop offset="100%" stop-color="#C4845A"/>
    </linearGradient>
    <linearGradient id="sakinaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#07111C"/>
    </linearGradient>
  </defs>

  <!-- Dark Disc Container -->
  <circle cx="16" cy="16" r="15" fill="url(#sakinaBg)" stroke="#C4845A" stroke-width="1.2" stroke-opacity="0.85"/>
  
  <!-- Subtle inner decorative halo ring -->
  <circle cx="16" cy="16" r="12.5" fill="none" stroke="#E8B97A" stroke-width="0.6" stroke-dasharray="1.5 2" stroke-opacity="0.5"/>

  <!-- Glowing Golden Medallion Base -->
  <circle cx="16" cy="16" r="10.5" fill="url(#sakinaGold)"/>

  <!-- Centered 4-pointed radiant Sakina star in midnight deep tone -->
  <path d="M 16 7.5 C 16 12 12 16 7.5 16 C 12 16 16 20 16 24.5 C 16 20 20 16 24.5 16 C 20 16 16 12 16 7.5 Z" fill="#07111C"/>
  
  <!-- Center radiant pearl sparkle -->
  <circle cx="16" cy="16" r="1.2" fill="#FFF8EE"/>
</svg>